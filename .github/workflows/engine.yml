# Durable download engine (Phase 1). Secrets required:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ARCHIVE_CHANNEL_ID
#   ARCHIVE_MANIFEST_REPO          e.g. owner/tr-market-archive-index
#   ARCHIVE_MANIFEST_TOKEN         PAT with contents:write on the index repo
# Optional: TELEGRAM_ADMIN_IDS, ENGINE_MAX_SECONDS, ENGINE_DISPATCH_TOKEN
name: Market Data Engine

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional queue request id hint"
        required: false
        default: ""
  repository_dispatch:
    types: [market-data-engine]

concurrency:
  group: market-data-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_ARCHIVE_CHANNEL_ID: ${{ secrets.TELEGRAM_ARCHIVE_CHANNEL_ID }}
          TELEGRAM_ARCHIVE_ENABLED: "true"
          ARCHIVE_MANIFEST_ENABLED: "true"
          ARCHIVE_MANIFEST_REPO: ${{ secrets.ARCHIVE_MANIFEST_REPO }}
          ARCHIVE_MANIFEST_TOKEN: ${{ secrets.ARCHIVE_MANIFEST_TOKEN }}
          ARCHIVE_MANIFEST_PATH: archive_manifest.json
          ENGINE_MAX_SECONDS: ${{ vars.ENGINE_MAX_SECONDS || '19200' }}
          ENGINE_DAY_MARGIN_SEC: ${{ vars.ENGINE_DAY_MARGIN_SEC || '900' }}
          ENGINE_STALE_SEC: ${{ vars.ENGINE_STALE_SEC || '900' }}
          ENGINE_WORKFLOW_REPO: ${{ github.repository }}
          ENGINE_WORKFLOW_ID: engine.yml
          ENGINE_DISPATCH_TOKEN: ${{ secrets.ARCHIVE_MANIFEST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLITE_PATH: db/tr_market_data.sqlite
          DATA_ROOT: data
        run: |
          set -e
          RID="${{ github.event.inputs.request_id || github.event.client_payload.request_id || '' }}"
          if [ -n "$RID" ]; then
            python -m scripts.actions_engine --once --request-id "$RID"
          else
            python -m scripts.actions_engine --once
          fi
